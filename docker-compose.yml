version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: data_pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

